services:
  api:
    build:
      context: /opt/carhub/api-src
      dockerfile: Dockerfile
    container_name: carhub-api
    env_file:
      - /opt/carhub/.env.api
    restart: unless-stopped
    ports:
      - "5000:8080"
    volumes:
      - carhub_uploads:/app/wwwroot/uploads

  web:
    build:
      context: /opt/carhub/web-src
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.carhub-mg.com
        NEXT_PUBLIC_BETA_MODE: "true"
        NEXT_PUBLIC_SITE_URL: https://carhub-mg.com
    container_name: carhub-web
    env_file:
      - /opt/carhub/.env.web
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  carhub_uploads:
